name: Production

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Generate route types
        run: npx next typegen

      - name: Type check
        run: npx tsc --noEmit -p .

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  migrate:
    name: Apply pending Supabase migrations
    needs: checks
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push pending migrations to production
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npx supabase db push --db-url "$SUPABASE_DB_URL" --yes

  deploy:
    name: Deploy to Vercel (production)
    needs: migrate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel deploy --prod --token="$VERCEL_TOKEN" --yes

  sync-db-types:
    name: Open a PR if DB types drifted after migrating
    needs: migrate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Runs after `migrate`, against the now-actually-applied schema — not
      # a pre-commit hook, because a migration you're committing locally
      # hasn't reached the live project yet at that point (only this job's
      # own `needs: migrate` guarantees that), so generating types any
      # earlier would silently regenerate the *old* schema's types instead.
      - name: Regenerate DB types from the newly migrated schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx supabase gen types typescript --project-id bvfsuibchotjtuzexwzq --schema public > src/lib/supabase/database.types.ts

      # Opens a PR rather than pushing straight to master — a CI bot
      # committing directly to the main branch unattended is a bigger blast
      # radius than this is worth; this way a human still merges it.
      - name: Open a PR if the types actually changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/lib/supabase/database.types.ts; then
            echo "No drift — types already match the migrated schema."
            exit 0
          fi

          branch="chore/sync-db-types-${GITHUB_SHA::7}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add src/lib/supabase/database.types.ts
          git commit -m "chore: sync database types with the latest migration"
          git push origin "$branch"
          gh pr create --title "chore: sync database types with the latest migration" \
            --body "Auto-generated after commit ${GITHUB_SHA} applied a migration to master. Regenerated via \`npm run db:types\` against the live schema." \
            --base master --head "$branch"
